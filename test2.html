 * worker-v25-fixed.js - v25.4-TEST-BRON-FIXED
 * Fix voor "Test per bron" en "Test gefilterd"
 * 
 * Wijzigingen t.o.v. v25.3:
 * - /test: als sourceFilter + default titel -> titel = "Test: {bron}"
 * - /test: als sourceFilter + default body -> body = "Dit is een testbericht van {bron} - {tijd}"
 * - article.source = sourceFilter (zodat SW bron als titel kan tonen)
 * - /send: zelfde fix + logging met targets.length en sourceFilter
 */

const VERSION = "v25.4-TEST-BRON-FIXED";
const DEFAULT_TITLE = "Nieuws Ommen";
const DEFAULT_BODY = "Er is nieuw nieuws beschikbaar!";

export default {
  async fetch(request, env, ctx) {
    const url = new URL(request.url);
    const path = url.pathname;

    // --- CORS / helpers ---
    const corsHeaders = {
      "Access-Control-Allow-Origin": "*",
      "Access-Control-Allow-Methods": "GET, POST, OPTIONS",
      "Access-Control-Allow-Headers": "Content-Type",
    };
    if (request.method === "OPTIONS") {
      return new Response(null, { headers: corsHeaders });
    }

    // --- DEBUG ---
    if (path === "/debug") {
      const subs = await env.SUBS_KV.get("subscriptions", { type: "json" }) || [];
      return new Response(JSON.stringify({ version: VERSION, count: subs.length, subs }, null, 2), {
        headers: { ...corsHeaders, "Content-Type": "application/json" }
      });
    }

    // --- TEST (naar iedereen, maar met bron in titel/body) ---
    if (path === "/test") {
      const sourceFilter = url.searchParams.get("source") || "";
      let title = url.searchParams.get("title") || DEFAULT_TITLE;
      let body = url.searchParams.get("body") || DEFAULT_BODY;
      const targetUrl = url.searchParams.get("url") || "/?highlight=test";

      // FIX 1: Als er een bron gefilterd is EN titel is nog default -> maak titel = Test: bron
      if (sourceFilter && title === DEFAULT_TITLE) {
        title = \`Test: \${sourceFilter}\`;
      }
      // FIX 2: Als er een bron gefilterd is EN body is nog default -> body met bron + tijd
      if (sourceFilter && body === DEFAULT_BODY) {
        body = \`Dit is een testbericht van \${sourceFilter} - \${new Date().toLocaleTimeString("nl-NL")}\`;
      }

      // FIX 3: article.source zetten zodat service-worker het als titel kan gebruiken
      const article = {
        id: "test-" + Date.now(),
        title: title,
        body: body,
        url: targetUrl,
        source: sourceFilter || "test", // <-- BELANGRIJK voor SW v241
        timestamp: Date.now()
      };

      // Stuur naar alle subs (of gefilterd als sourceFilter meegegeven via andere param? hier altijd all)
      // Maar bewaar source in payload
      const payload = JSON.stringify({
        title: article.title,
        body: article.body,
        url: article.url,
        source: article.source,
        tag: \`test-\${article.source}-\${Date.now()}\`
      });

      const subs = await env.SUBS_KV.get("subscriptions", { type: "json" }) || [];
      let sent = 0;
      for (const sub of subs) {
        try {
          await sendPush(sub, payload, env);
          sent++;
        } catch (e) { console.error("Push fail", e); }
      }

      return new Response(JSON.stringify({
        ok: true,
        version: VERSION,
        mode: "test-per-bron",
        sourceFilter: sourceFilter || "(geen - naar iedereen)",
        article,
        sent,
        totalSubs: subs.length

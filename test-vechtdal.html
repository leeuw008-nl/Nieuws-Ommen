<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Vechtdal Centraal Test</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
    white-space:pre-wrap;
}
</style>

</head>
<body>

<h2>Vechtdal Centraal test</h2>

<div id="resultaat">
Bezig met ophalen...
</div>

<script>

const PROXY = "https://corsproxy.io/?";

async function test() {

    const url =
        "https://www.vechtdalcentraal.nl/sitemap.xml";

    try {

        const response =
            await fetch(
                PROXY + encodeURIComponent(url)
            );

        const text =
            await response.text();

        document.getElementById("resultaat").innerHTML =
            "<b>Status:</b> " + response.status +
            "<br><br>" +
            "<b>Lengte:</b> " + text.length +
            "<br><br>" +
            "<b>Eerste 1500 tekens:</b><br><hr>" +
            text
                .substring(0,1500)
                .replace(/</g,"&lt;")
                .replace(/>/g,"&gt;");

    }

    catch(e) {

        document.getElementById("resultaat").innerHTML =
            "Fout:<br><br>" + e;

    }

}

test();

</script>

</body>
</html>

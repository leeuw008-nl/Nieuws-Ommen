<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ommen Nieuws - Informatie</title>
<style>
 :root{--blue:#0b5bd3}
 *{box-sizing:border-box}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f6f8fb;color:#1a1d23}
 header{background:var(--blue);color:#fff;padding:18px 16px}
 header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em}
 header p{margin:6px 0 0;opacity:.9;font-size:13px}
 .wrap{max-width:840px;margin:0 auto;padding:0 16px}
 .tabs{display:flex;gap:6px;overflow:auto;padding:12px 0 0;border-bottom:1px solid #e3e8f0;margin-bottom:16px;scrollbar-width:none}
 .tabs::-webkit-scrollbar{display:none}
 .tabs button{white-space:nowrap;border:1px solid #dbe3f0;background:#fff;color:#2a3a55;padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;flex-shrink:0}
 .tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
 .card{background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px;line-height:1.6}
 .card h2{margin:0 0 10px;font-size:18px}
 .card ul{padding-left:18px;margin:8px 0}
 .muted{color:#5a6b86;font-size:13px}
 .btn{appearance:none;border:0;background:var(--blue);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
 .btn.secondary{background:#eef3ff;color:var(--blue)}
 .stack{display:flex;flex-direction:column;gap:10px}
 .row{display:flex;gap:10px;flex-wrap:wrap}
 input{border:1px solid #dbe3f0;border-radius:10px;padding:10px 12px;font-size:14px;width:100%}
 .badge{display:inline-block;background:#eef3ff;color:#0b5bd3;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}
 pre{white-space:pre-wrap;word-break:break-word;background:#f6f8fb;padding:10px;border-radius:10px;border:1px solid #e6ebf2}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <h1>Ommen Nieuws & Meldingen</h1>
  <p>Simpel overzicht – geen technische info</p>
 </div>
</header>
<div class="wrap">
 <nav class="tabs" id="tabs"></nav>
 <div id="content"></div>
 <p class="muted" style="margin:22px 0 32px">Contact: leeuw008@gmail.com — Privacy: geen tracking, alleen push-abonnement indien je meldingen aanzet.</p>
</div>
<script>
var WORKER_URL = 'https://ommen-push-v2.YOUR_SUBDOMAIN.workers.dev';
var ADMIN_EMAIL = 'leeuw008@gmail.com';
var tabsDef = [
 {id:'over', label:'Over'},
 {id:'bronnen', label:'Bronnen'},
 {id:'meldingen', label:'Meldingen'},
 {id:'privacy', label:'Privacy & Contact'}
];
var bronnen = [
 '1. Gemeente Ommen – ommen.nl',
 '2. RTV Oost – rtv-oost.nl/ommen',
 '3. De Stentor – Ommen',
 '4. Politie Oost-Nederland – politie.nl',
 '5. Brandweer IJsselland – brandweer.nl',
 '6. 112 Ommen – p2000 meldingen',
 '7. Waterschap Vechtstromen',
 '8. Rijkswaterstaat – verkeer',
 '9. Buienradar / KNMI – weeralarmen'
];
var active = 'over';
function isAdmin(){
 try{
  var v = (localStorage.getItem('email')||'').toLowerCase().trim();
  return v === ADMIN_EMAIL;
 }catch(e){return false}
}
function renderTabs(){
 var nav = document.getElementById('tabs');
 var all = tabsDef.slice();
 if(isAdmin()) all.push({id:'beheer', label:'Beheer'});
 nav.innerHTML = all.map(function(t){
  return '<button class="'+(active===t.id?'active':'')+'" data-tab="'+t.id+'">'+t.label+'</button>';
 }).join('');
 nav.querySelectorAll('button').forEach(function(b){
  b.addEventListener('click', function(){
   active = b.getAttribute('data-tab');
   renderTabs();
   renderContent();
  });
 });
}
function renderContent(){
 var el = document.getElementById('content');
 if(active==='over'){
  el.innerHTML = '<div class="card"><span class="badge">Over deze app</span><h2>Wat doet deze app?</h2><p>Deze app verzamelt nieuws en meldingen rond Ommen en omgeving. Geen extra techniek, gewoon duidelijk wat er speelt.</p><p>Je krijgt alleen een melding bij echt belangrijk nieuws (112, weer, wegafsluiting). Je kiest zelf of je meldingen aan wilt.</p></div>';
 }
 if(active==='bronnen'){
  el.innerHTML = '<div class="card"><h2>9 bronnen</h2><ul>'+bronnen.map(function(b){return '<li>'+b+'</li>';}).join('')+'</ul><p class="muted">Bronnen worden elk uur gecontroleerd. Geen trackers, geen cookies.</p></div>';
 }
 if(active==='meldingen'){
  el.innerHTML = '<div class="card"><h2>Meldingen</h2><p>Wil je een seintje bij belangrijk nieuws?</p><div class="stack"><button class="btn" id="btnEnable">Meldingen aanzetten</button><p class="muted" id="notifStatus"></p></div><p class="muted" style="margin-top:12px">Werkt op telefoon en desktop. Je kunt het altijd weer uitzetten in je browser instellingen.</p></div>';
  setTimeout(function(){
   var s=document.getElementById('notifStatus');
   if(!('Notification' in window)) s.textContent='Meldingen worden niet ondersteund in deze browser.';
   else s.textContent='Status: '+Notification.permission;
   var btn=document.getElementById('btnEnable');
   if(btn){
    btn.addEventListener('click', async function(){
     try{
      var perm = await Notification.requestPermission();
      s.textContent='Status: '+perm;
      if(perm==='granted' && WORKER_URL.indexOf('YOUR_SUBDOMAIN')===-1){
       var reg = await navigator.serviceWorker.register('/sw.js');
       var vapid = await fetch(WORKER_URL+'/vapidPublicKey').then(function(r){return r.text();});
       var sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(vapid)});
       await fetch(WORKER_URL+'/subscribe',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(sub)});
       s.textContent+=' - geregistreerd';
      }
     }catch(e){ s.textContent='Fout: '+e.message; }
    });
   }
  },0);

function base64UrlToBytes(b64url){

async function sha256Hex(str){

function getVapidJwk(env){

// DER -> JOSE conversie voor ECDSA (voor het geval subtle.sign DER geeft)
function derToJose(der){
  // Simpel: als lengte 64 al raw, return
  if(der.length===64) return der;
  // DER: 0x30 len 0x02 lenR R 0x02 lenS S
  try{
    var bytes = der;
    if(bytes[0]!==0x30) return der;
    var rLen = bytes[3];
    var rStart = 4;
    var r = bytes.slice(rStart, rStart+rLen);
    var sStart = rStart+rLen+2;
    var sLen = bytes[sStart-1];
    var s = bytes.slice(sStart, sStart+sLen);
    // strip leading zeros
    if(r.length>32 && r[0]===0) r = r.slice(1);
    if(s.length>32 && s[0]===0) s = s.slice(1);
    // pad to 32
    var rPadded = new Uint8Array(32);
    rPadded.set(r, 32-r.length);
    var sPadded = new Uint8Array(32);
    sPadded.set(s, 32-s.length);
    var out = new Uint8Array(64);
    out.set(rPadded,0);
    out.set(sPadded,32);
    return out;
  }catch(e){ return der; }
}

async function createVapidJwt(aud, env){

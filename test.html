<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ommen Nieuws - Test Dashboard v16</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:12px;background:#f6f7f9}
.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.btn{border:none;border-radius:8px;padding:10px 14px;margin:4px;font-weight:600;cursor:pointer;color:#fff}
.blue{background:#2563eb}.green{background:#059669}.red{background:#dc2626}.gray{background:#6b7280}
pre{background:#0f172a;color:#22c55e;padding:12px;border-radius:8px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px}
input,select{padding:8px;border:1px solid #d1d5db;border-radius:6px;margin:4px}
</style>
</head>
<body>
<h2>🧪 Ommen Nieuws - Test Dashboard v16</h2>
<div>Worker: <code>ommen-push-v2.leeuw008.workers.dev</code> <span id="wStatus"></span></div>

<div class="card">
<button class="btn blue" onclick="doCron()">▶️ Cron starten</button>
<button class="btn green" onclick="doDebug()">🧱 Debug / KV</button>
<button class="btn red" onclick="doTestPush()">🔔 Test Push sturen</button>
<button class="btn gray" onclick="clearLog()">🗑️ Clear</button>
<select id="srcSel">
<option>De Stentor</option><option selected>Gemeente Ommen</option><option>Ommen City</option><option>OudOmmen</option><option>RondOmmen</option><option>RTV Oost</option><option>RTV Vechtdal</option><option>Vechtdal Centraal</option><option>Natuurlijk Ommen</option>
</select>
<input id="titleIn" placeholder="Titel" value="Test bericht" style="width:160px">
<input id="bodyIn" placeholder="Body" value="Dit is een test" style="width:220px">
</div>

<div class="card">
<b>Status 9 bronnen</b>
<div id="statusBox" style="margin-top:8px"></div>
</div>

<div class="card">
<b>Log</b>
<pre id="log">Klaar...
</pre>
</div>

<script>
const WORKER='https://ommen-push-v2.leeuw008.workers.dev';
const logEl=document.getElementById('log');
function addLog(t){ const time=new Date().toLocaleTimeString('nl-NL'); logEl.textContent+=`\n${time} - ${t}`; logEl.scrollTop=logEl.scrollHeight; }
function clearLog(){ logEl.textContent='Klaar...'; }

async function fetchTextSafe(url, opts){
  try{
    const r=await fetch(url, opts);
    const txt=await r.text();
    // probeer JSON, maar als het geen JSON is, geef plain text terug (FIX voor v15 fout)
    try{ const j=JSON.parse(txt); return {ok:r.ok, status:r.status, text:txt, json:j}; }
    catch{ return {ok:r.ok, status:r.status, text:txt, json:null}; }
  }catch(e){ return {ok:false, status:0, text:'Fetch error: '+e.message, json:null}; }
}

async function doCron(){
  addLog('Cron starten...');
  const res=await fetchTextSafe(WORKER+'/cron',{method:'POST'});
  if(!res.ok && res.status===0){
    const res2=await fetchTextSafe(WORKER+'/trigger',{method:'POST'});
    addLog(`Cron POST /trigger ${res2.status}: ${res2.text.slice(0,500)}`);
    document.getElementById('statusBox').innerHTML='<span style="color:green">'+res2.text.slice(0,500)+'</span>';
    return;
  }
  addLog(`Cron ${res.status}: ${res.text.slice(0,500)}`);
  document.getElementById('statusBox').innerHTML='<pre>'+res.text.slice(0,2000)+'</pre>';
}

async function doDebug(){
  addLog('Debug / KV ophalen...');
  const eps=['/debug','/kv','/status','/stats','/subs'];
  let out='';
  for(const ep of eps){
    const r=await fetchTextSafe(WORKER+ep);
    out+=`\n== ${ep} (${r.status}) ==\n${r.text.slice(0,1500)}\n`;
    addLog(`${ep} ${r.status}: ${r.text.slice(0,200)}`);
  }
  document.getElementById('statusBox').innerHTML='<pre>'+out+'</pre>';
}

async function doTestPush(){
  const src=document.getElementById('srcSel').value;
  const title=document.getElementById('titleIn').value||'Test';
  const body=document.getElementById('bodyIn').value||'Test body';
  addLog(`Test Push sturen voor ${src}...`);
  const q=`${WORKER}/send?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}&source=${encodeURIComponent(src)}&url=${encodeURIComponent('/')}`;
  const r=await fetchTextSafe(q);
  addLog(`Send ${r.status}: ${r.text.slice(0,500)}`);
  document.getElementById('statusBox').innerHTML=`<span style="color:${r.ok?'green':'red'}">Push ${src}: ${r.status}<br>${r.text.slice(0,1000)}</span>`;
}

async function checkWorker(){
  const r=await fetchTextSafe(WORKER+'/vapidPublicKey');
  document.getElementById('wStatus').textContent=r.ok?'✅ ONLINE':'❌ '+r.text.slice(0,100);
}
checkWorker();
</script>
</body>
</html>

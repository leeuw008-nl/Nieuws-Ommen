    SOURCES.forEach(n=> def[n] = {aan:true, vandaag:false, scope:scopeDef});

  function loadState(){

      const v2 = localStorage.getItem('nieuwsommen_bronnen_v2');

        const out = {};
        SOURCES.forEach(n=>{

        });

      }
      const v1 = localStorage.getItem('nieuwsommen_bronnen');
      if(v1){
        const p = JSON.parse(v1);
        const onlyChecked = document.getElementById('only-ommen')?.checked ?? true;
        const out = {};
        SOURCES.forEach(n=>{
          const val = p[n];
          if(typeof val==='boolean'){
            out[n] = {aan:val, vandaag:false, scope: onlyChecked?'gemeente':'regio'};
          } else if(val && typeof val==='object'){
            out[n] = {aan: val.aan!==false, vandaag: !!val.vandaag, scope: val.scope==='regio'?'regio':'gemeente'};
          } else {
            out[n] = {aan:true, vandaag:false, scope: onlyChecked?'gemeente':'regio'};
          }
        });
        return out;
      }
    }catch(e){ console.warn('load fail', e); }
    return getDefaultState();
  }

  function saveState(state){
    try{ localStorage.setItem('nieuwsommen_bronnen_v2', JSON.stringify(state)); }catch(e){}
  }

  function syncCompat(state){
    // update hidden source-filter checkboxes voor script.js
    SOURCES.forEach(name=>{
      const cb = document.querySelector('#compat-hidden .source-filter[value="'+CSS.escape(name)+'"]');
      if(cb){
        const should = state[name]?.aan ?? true;
        if(cb.checked !== should){
          cb.checked = should;
          cb.dispatchEvent(new Event('change',{bubbles:true}));
        }
      }
    });
    // scope compat: globaal only-ommen = true als minimaal 1 bron gemeente is (voor oude script.js)
    const anyGemeente = Object.values(state).some(v=>v.scope==='gemeente');
    const only = document.getElementById('only-ommen');
    if(only && only.checked !== anyGemeente){
      only.checked = anyGemeente;
      only.dispatchEvent(new Event('change',{bubbles:true}));

  }

  function updateUI(state){
    const total = SOURCES.length;

    const badge = $('.count-badge');

    if(badge) badge.textContent = String(total);
    if(active) active.textContent = '• '+aanCount+' aan';

    SOURCES.forEach(name=>{
      const row = document.querySelector('.source-row[data-source="'+CSS.escape(name)+'"]');
      if(!row) return;
      const cfg = state[name];
      if(!cfg) return;
      row.classList.toggle('off', !cfg.aan);

      const vInput = row.querySelector('.toggle-vandaag input');
      const sInput = row.querySelector('.toggle-scope input');
      const aInput = row.querySelector('.toggle-aan input');
      const vLabel = row.querySelector('.toggle-vandaag .mini-label');
      const sLabel = row.querySelector('.toggle-scope .mini-label');
      const aLabel = row.querySelector('.toggle-aan .mini-label');

      if(vInput) vInput.checked = cfg.vandaag;
      if(sInput) sInput.checked = cfg.scope==='gemeente';
      if(aInput) aInput.checked = cfg.aan;
      if(vLabel) vLabel.textContent = cfg.vandaag ? 'VANDAAG' : 'MEER';
      if(sLabel) sLabel.textContent = cfg.scope==='gemeente' ? 'GEMEENTE' : 'REGIO';
      if(aLabel) aLabel.textContent = cfg.aan ? 'AAN' : 'UIT';
    });
  }

  let state = loadState();

  function handleChange(name, field, value){
    if(!state[name]) state[name] = {aan:true, vandaag:false, scope:'gemeente'};
    state[name][field] = value;
    saveState(state);
    updateUI(state);
    syncCompat(state);
  }

  // init
  updateUI(state);
  syncCompat(state);

  // bind per row toggles
  SOURCES.forEach(name=>{
    const row = document.querySelector('.source-row[data-source="'+CSS.escape(name)+'"]');
    if(!row) return;
    const vInput = row.querySelector('.toggle-vandaag input');
    const sInput = row.querySelector('.toggle-scope input');
    const aInput = row.querySelector('.toggle-aan input');
    if(vInput) vInput.addEventListener('change', e=> handleChange(name,'vandaag', e.target.checked));
    if(sInput) sInput.addEventListener('change', e=> handleChange(name,'scope', e.target.checked ? 'gemeente' : 'regio'));
    if(aInput) aInput.addEventListener('change', e=> handleChange(name,'aan', e.target.checked));
  });

  const allBtn = document.getElementById('toggle-all');
  if(allBtn){
    allBtn.addEventListener('click', ()=>{
      const allOn = Object.values(state).every(v=>v.aan);
      SOURCES.forEach(n=> state[n].aan = !allOn);
      saveState(state);
      updateUI(state);
      syncCompat(state);
    });
  }

  // expose for debug
  window.__nieuwsommenState = state;
})();

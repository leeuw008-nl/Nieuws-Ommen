<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuw(s)Ommen</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icons/icon-192x192.png" type="image/png">
<meta name="theme-color" content="#0b5bd3">
<style id="override-lichter-groen-fix">
  /* 1. Alles aan = lichter groen */
  #btn-all.all-on,
  #btn-all[aria-pressed="true"] {
    background: #d6ffdf !important;
    color: #065f46 !important;
    border-color: #86efac !important;
  }

  /* 2. Bel - basis altijd klikbaar */
  #bell-slot button,
  #bell-slot .bell-btn,
  #bell-slot [id*="bell"],
  #bell-slot [class*="bell"] {
    pointer-events: auto !important;
    cursor: pointer !important;
  }

  /* 3. Bel UIT = wit (standaard) */
  #bell-slot button:not(.enabled):not(.active):not(.on):not(.subscribed):not(.push-enabled):not([aria-pressed="true"]) {
    background: #ffffff !important;
  }

  /* 4. Bel AAN/ingeschakeld = zelfde lichte groen als Alles aan */
  #bell-slot button.enabled,
  #bell-slot button.active,
  #bell-slot button.on,
  #bell-slot button.subscribed,
  #bell-slot button.push-enabled,
  #bell-slot button[aria-pressed="true"],
  #bell-slot .bell-btn.enabled,
  #bell-slot .bell-btn.active,
  #bell-slot [class*="bell"].enabled,
  #bell-slot [class*="bell"].active {
    background: #d6ffdf !important;
    color: #065f46 !important;
    border-color: #86efac !important;
    pointer-events: auto !important;
  }
</style>
</head>
<body>
<header>
  <h1><span class="title-left">📰 Nieuw(s)Ommen</span><a href="informatie.html" class="info-icon-btn" title="Info">i</a></h1>
  <div class="search-row"><input type="text" id="search-input" placeholder="Zoek in nieuws..."></div>
  <div class="filter-header" id="filter-header">
    <div class="filter-header-center"><span class="filter-header-count" id="header-count">9 v/d 9 bronnen</span></div>
    <div class="filter-header-right">
      <div class="bell-slot" id="bell-slot"></div>
      <button class="btn-all-toets" id="btn-all">Alles aan</button>
      <span class="filter-header-arrow">▼</span>
    </div>
  </div>
  <div id="source-panel">
    <div class="panel-hint">
      <div><b>VANDAAG</b> &lt;-&gt; <b>MEER</b> = alleen vandaag of meerdere dagen</div>
      <div><b>GEMEENTE</b> &lt;-&gt; <b>REGIO</b> = alleen gemeente Ommen of ook regio</div>
      <div><b>AAN</b> &lt;-&gt; <b>UIT</b> = aan/uit</div>
    </div>
    <div class="source-list" id="source-list"></div>
    <div class="panel-footer">
      <button onclick="resetFilters()">Reset</button>
      <button class="primary" onclick="closePanel()">Sluiten ▲</button>
    </div>
  </div>
  <div id="news-container-anchor"></div>
  <div id="compat-hidden" style="display:none">
    <input type="checkbox" id="only-ommen" checked>
    <div id="compat-sources"></div>
  </div>
</header>
<main><div id="news-container">Bezig met laden...</div></main>
<footer><button onclick="refreshNews()">🔄 Vernieuwen</button></footer>

<script src="app.js"></script>
<script src="news.js"></script>
<script src="push.js"></script>
<script src="article-focus.js"></script>
<script>
// Fix: zorg dat bel altijd klikbaar blijft, ook nadat push.js hem opnieuw rendert
(function(){
  const slot = document.getElementById('bell-slot');
  if(!slot) return;
  const makeClickable = () => {
    const btn = slot.querySelector('button, [role="button"]');
    if(btn){
      btn.style.pointerEvents = 'auto';
      btn.style.cursor = 'pointer';
    }
  };
  // Bij elke render van push.js opnieuw fixen
  const obs = new MutationObserver(makeClickable);
  obs.observe(slot, { childList: true, subtree: true });
  // Ook na laden
  window.addEventListener('load', makeClickable);
  setTimeout(makeClickable, 500);
})();
</script>
</body>
</html>

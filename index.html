<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieuw(s)Ommen v111 FIX artikelen terug</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon-192x192.png" type="image/png">
    <style>
    header h1{display:flex;align-items:center;gap:12px;justify-content:center;width:100%;min-height:48px;padding-top:10px !important;}
    .title-left{display:inline-flex;align-items:center;justify-content:center;gap:0;}
    .info-icon-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.45);display:inline-flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-weight:900;font-size:26px;line-height:1;flex-shrink:0;align-self:center;margin-top:2px}
    @media(max-width:400px){header h1{font-size:1.4em}}
    body{margin:0 !important;padding:0 !important}
    header{padding:7px 12px 0 12px !important;box-sizing:border-box !important;width:100% !important;max-width:640px !important;margin:0 auto !important;display:block !important;float:none !important;left:auto !important;right:auto !important}
    header h1{margin:0 auto 8px auto !important;width:100% !important;max-width:100% !important;box-sizing:border-box !important;display:flex !important;justify-content:center !important;align-items:center !important;padding:10px 0 0 0 !important}
    .search-row{margin:0 auto 8px auto !important;padding:0 !important;box-sizing:border-box !important;width:100% !important;max-width:100% !important;display:block !important;float:none !important}
    .search-row input{width:100% !important;max-width:100% !important;box-sizing:border-box !important;padding:10px 12px !important;border-radius:10px !important;border:1px solid rgba(255,255,255,.6) !important;font-size:15px !important;display:block !important;margin:0 auto !important;text-align:left !important}
    .filter-header{
        margin:0 auto !important;box-sizing:border-box !important;width:100% !important;max-width:100% !important;float:none !important;
        background:#fff;border:1px solid #e5e7eb;border-radius:12px;
        padding:6px 8px !important;display:flex;align-items:center;justify-content:space-between;
        cursor:pointer;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:all .2s;gap:6px;
        min-height:36px;
    }
    .filter-header:active{transform:scale(0.99)}
    .filter-header.open{border-radius:12px 12px 0 0;border-bottom:2px solid #0b5bd3 !important;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .filter-header-left{display:flex;align-items:center;flex-shrink:0}
    .tool-icon-left{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;flex-shrink:0}
    .filter-header-center{flex:1;display:flex;justify-content:center;align-items:center}
    .filter-header-count{font-weight:600;color:#1d4ed8;font-size:11px;white-space:nowrap;background:#eff6ff;padding:4px 10px;border-radius:999px;border:1px solid #bfdbfe;line-height:1;height:28px;min-height:28px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center}
    .filter-header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .bell-slot{display:flex !important;align-items:center !important;justify-content:center !important;min-width:42px !important;min-height:28px !important;width:42px !important}
    .bell-slot:empty::after{content:"🔔";opacity:.25;font-size:18px}
    .bell-slot > *{width:42px !important;height:28px !important;min-width:42px !important;min-height:28px !important;display:flex !important;align-items:center !important;justify-content:center !important;background:#fff;border:1px solid #e5e7eb !important;border-radius:8px !important;font-size:20px !important;line-height:1 !important;padding:0 4px !important} #bell-slot button, #bell-slot [id*="push"], #bell-slot [class*="push"], #bell-slot [id*="bell"], #bell-slot [class*="bell"]{width:42px !important;min-width:42px !important;font-size:20px !important}
    .btn-all-toets{
        font-size:11px;font-weight:700;background:#E8FFEA;border:1px solid #A7F3D0;color:#065f46;
        padding:4px 10px !important;border-radius:999px;cursor:pointer;white-space:nowrap;
        margin:0 !important;min-width:78px;height:28px;display:inline-flex;align-items:center;justify-content:center;line-height:1;transition:all .2s;
    }
    .btn-all-toets.all-on{background:#E8FFEA !important;border-color:#A7F3D0 !important;color:#065f46 !important}
    .btn-all-toets.all-off{background:#fee2e2 !important;border-color:#fca5a5 !important;color:#991b1b !important}
    .btn-all-toets.some-on{background:#fef9c3 !important;border-color:#fde68a !important;color:#854d0e !important}
    .filter-header-arrow{
        font-size:14px;color:#0f172a;flex-shrink:0;
        width:32px;height:28px;
        background:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;
        text-align:center;display:flex;align-items:center;justify-content:center;
        transition:all .2s;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);
    }
    .filter-header-arrow:hover{background:#e2e8f0;border-color:#94a3b8}
    .filter-header-arrow:active{transform:scale(0.92)}
    .filter-header.open .filter-header-arrow{transform:rotate(180deg);background:#0f172a;color:#fff;border-color:#0f172a}
    #source-panel{
        margin:0 auto !important;width:100% !important;max-width:100% !important;box-sizing:border-box !important;background:#fff;border:1px solid #e5e7eb;border-top:0;border-radius:0 0 12px 12px;
        overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease, opacity .25s ease, box-shadow .25s ease, transform .25s ease;
        box-shadow:0 4px 12px rgba(0,0,0,.06);
        transform:translateY(-2px);
    }
    #source-panel.open{
        max-height:3000px;opacity:1;
        transform:translateY(0);
        box-shadow:0 12px 24px rgba(15,23,42,0.12), 0 4px 12px rgba(15,23,42,0.08);
        margin-bottom:0 !important;
    }
    .panel-hint{background:#f8fafc;border-top:2px solid #0b5bd3;border-bottom:2px solid #0b5bd3;padding:4px 8px !important;font-size:11px;color:#475569;line-height:1.3;text-align:left}
    .panel-hint ul{margin:0 !important;padding:0 0 0 14px !important;list-style:disc;list-style-position:outside;text-align:left}
    .panel-hint li{margin:1px 0 !important;padding:0 !important;text-align:left}
    .panel-hint div{margin:1px 0}
    main{padding:0 12px !important;box-sizing:border-box !important;margin:0 auto !important;width:100% !important;max-width:640px !important;position:relative}
    #news-container{margin-top:0 !important;padding-top:0 !important;position:relative}
    .filter-header:not(.open){margin-bottom:8px !important;box-shadow:0 2px 6px rgba(15,23,42,0.07), 0 1px 2px rgba(15,23,42,0.04)}
    #source-panel.open + #news-container-anchor{height:12px;display:block}
    #source-panel.open ~ main #news-container{margin-top:4px !important}
    body.panel-open #news-container::before{
        content:"";
        display:block;
        height:16px;
        margin:0 -12px 0 -12px;
        background:linear-gradient(to bottom, rgba(15,23,42,0.07), transparent);
        pointer-events:none;
    }
    .articles-count{font-size:14px;font-weight:700;color:#0f172a;padding:6px 2px 8px 2px;margin:0;display:flex;align-items:center;gap:6px}
    .articles-count::before{content:"";width:3px;height:14px;background:#0b5bd3;border-radius:999px;flex-shrink:0}
    .source-list{display:flex;flex-direction:column}
    .source-row{display:grid;grid-template-columns:1fr 156px;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid #0b5bd3;transition:background .12s}
    .source-row:last-child{border-bottom:0}
    .source-row:hover{background:#f8fafc}
    .source-row.off{background:#f9fafb;opacity:.6}
    .source-meta{display:flex;flex-direction:column;min-width:0;align-items:flex-start;text-align:left;justify-content:center}
    .source-name{font-weight:700;font-size:14.5px;line-height:1.0;white-space:normal;word-break:break-word;color:#0f172a;text-align:left;width:100%;letter-spacing:-0.1px}
    .source-sub{font-size:11px;color:#64748b;margin-top:0px;text-align:left;width:100%;line-height:1.0}
    .toggles{display:grid;grid-template-columns:48px 52px 52px;gap:3px;align-items:start;justify-content:end}
    .toggle-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;min-height:32px}
    .mini-switch{position:relative;width:32px;height:20px;background:#e5e7eb;border-radius:999px;cursor:pointer;transition:background .2s;border:0;padding:0;display:inline-flex;flex-shrink:0}
    .mini-switch input{display:none}
    .mini-slider{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s;transform:translateX(12px)}
    .mini-switch input:checked + .mini-slider{transform:translateX(0px)}
    .mini-switch.checked.vandaag{background:#0b5bd3}
    .mini-switch.checked.scope-gemeente{background:#0b5bd3}
    .mini-switch.checked.scope-regio{background:#7c3aed}
    .mini-switch.checked.aan{background:#16a34a !important}
    .mini-switch:not(.checked).aan{background:#e5e7eb !important;border:1px solid #d1d5db}
    .mini-label{font-size:8px;font-weight:800;letter-spacing:.4px;color:#6b7280;text-transform:uppercase;text-align:center;line-height:1}
    .panel-footer{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-top:2px solid #0b5bd3}
    .panel-footer button{font-size:11px;padding:5px 9px;border-radius:7px;border:1px solid #e5e7eb;background:#fff;cursor:pointer}
    .panel-footer button.primary{background:#0f172a;color:#fff;border-color:#0f172a;font-weight:600}
    #bell-slot{width:42px !important;min-width:42px !important}
    #bell-slot *{width:42px !important;min-width:42px !important;font-size:20px !important}
    #bell-slot button{padding:0 6px !important}
    </style>

<style id="bell-final-0901">
#bell-slot button.enabled, #bell-slot button.active, #bell-slot button[aria-pressed="true"]{
  background:#E8FFEA !important;background-color:#E8FFEA !important;
  border:1px solid #A7F3D0 !important;border-color:#A7F3D0 !important;
  color:#065f46 !important;opacity:1 !important;
}
</style>

</head>
<body>
<header>
    <h1>
        <span class="title-left">📰 Nieuw(s)Ommen</span>
        <a href="informatie.html" class="info-icon-btn" title="Info" aria-label="Informatie">i</a>
    </h1>
    <div class="search-row">
        <input type="text" id="search-input" placeholder="Zoek in nieuws...">
    </div>
    <div class="filter-header" id="filter-header">
        <div class="filter-header-center"><span class="filter-header-count" id="header-count">9 v/d 9 bronnen ingeschakeld</span></div>
        <div class="filter-header-right">
            <div class="bell-slot" id="bell-slot"></div>
            <button class="btn-all-toets" id="btn-all">Alles aan</button>
            <span class="filter-header-arrow">▼</span>
        </div>
    </div>
    <div id="source-panel">
        <div class="panel-hint">
            <div><b>VANDAAG</b> &lt;-&gt; <b>MEER</b> = alleen vandaag of meerdere dagen</div>
            <div><b>GEMEENTE</b> &lt;-&gt; <b>REGIO</b> = alleen gemeente Ommen of ook regio</div>
            <div><b>AAN</b> &lt;-&gt; <b>UIT</b> = aan/uit-schakelen bronnen (tonen + notificaties)</div>
        </div>
        <div class="source-list" id="source-list"></div>
        <div class="panel-footer">
            <button onclick="resetFilters()">Reset</button>
            <button class="primary" onclick="closePanel()">Sluiten ▲</button>
        </div>
    </div>
    <div id="news-container-anchor"></div>
    <div id="compat-hidden" style="display:none">
        <input type="checkbox" id="only-ommen" checked>
        <div id="compat-sources"></div>
    </div>
</header>
<main>
    <div id="news-container">Bezig met laden...</div>
</main>
<footer>
    <button onclick="refreshNews()">🔄 Vernieuwen</button>
</footer>
<script>
const BRONNEN = [
  {id:'De Stentor', name:'De Stentor', sub:'regionaal (Ommen)'},
  {id:'Gemeente Ommen', name:'Gemeente Ommen', sub:'officiële berichten'},
  {id:'Ommen City', name:'Ommen City', sub:'lokaal nieuws Ommen'},
  {id:'OudOmmen', name:'OudOmmen', sub:'artikelen over historie'},
  {id:'RondOmmen', name:'RondOmmen', sub:'lokaal nieuws'},
  {id:'RTV Oost', name:'RTV Oost', sub:'regionaal Overijssel'},
  {id:'RTV Vechtdal', name:'RTV Vechtdal', sub:'lokaal Vechtdal - via VechtdalLeeft'},
  {id:'Vechtdal Centraal', name:'Vechtdal Centraal', sub:'112 & dorpsnieuws'},
  {id:'Natuurlijk Ommen', name:'Natuurlijk Ommen', sub:'evenementen & toerisme'},
];
let state = {};
function loadState(){
  try{
    const v2 = localStorage.getItem('nieuwsommen_bronnen_v2');
    if(v2){
      state = JSON.parse(v2);
      // MIGRATIE: Salland Centraal -> verwijderen, Natuurlijk Ommen -> toevoegen
      let changed=false;
      if(state['Salland Centraal']){
        delete state['Salland Centraal'];
        changed=true;
      }
      BRONNEN.forEach(b=>{
        if(!state[b.id]){
          state[b.id]={aan:true, vandaag:false, scope:'gemeente'};
          changed=true;
        }
      });
      if(changed){
        saveState();
      }
    } else {
      const old = {};
      BRONNEN.forEach(b=> old[b.id] = {aan:true, vandaag:false, scope:'gemeente'});
      state = old; saveState();
    }
  }catch(e){ 
    const fresh={};
    BRONNEN.forEach(b=>fresh[b.id]={aan:true,vandaag:false,scope:'gemeente'});
    state=fresh;
  }
}
function saveState(){
  localStorage.setItem('nieuwsommen_bronnen_v2', JSON.stringify(state));
  updateHiddenCompat(); updateHeaderCount();
}
function updateHiddenCompat(){
  const cont = document.getElementById('compat-sources');
  cont.innerHTML='';
  BRONNEN.forEach(b=>{
    const s = state[b.id] || {aan:true,vandaag:false,scope:'gemeente'};
    let cb = document.createElement('input');
    cb.type='checkbox'; cb.className='source-filter'; cb.value=b.id; cb.checked=s.aan;
    cb.dataset.source=b.id;
    cont.appendChild(cb);
    cb.dispatchEvent(new Event('change',{bubbles:true}));
  });
  const gemeenteCount = BRONNEN.filter(b=> (state[b.id]?.scope||'gemeente')==='gemeente').length;
  const onlyCb = document.getElementById('only-ommen');
  if(onlyCb){ onlyCb.checked = gemeenteCount >= 5; onlyCb.dispatchEvent(new Event('change',{bubbles:true})); }
}
function render(){
  const list = document.getElementById('source-list');
  list.innerHTML='';
  BRONNEN.forEach(b=>{
    const s = state[b.id] || {aan:true,vandaag:false,scope:'gemeente'};
    const row = document.createElement('div');
    row.className='source-row'+(s.aan?'':' off');
    row.dataset.source=b.id;
    const scopeIsGemeente = s.scope==='gemeente';
    row.innerHTML = `
      <div class="source-meta">
        <div class="source-name">${b.name}</div>
        <div class="source-sub">${b.sub}</div>
      </div>
      <div class="toggles">
        <div class="toggle-col">
          <label class="mini-switch vandaag ${s.vandaag?'checked':''}">
            <input type="checkbox" ${s.vandaag?'checked':''} data-type="vandaag" data-id="${b.id}">
            <span class="mini-slider"></span>
          </label>
          <span class="mini-label">${s.vandaag?'VANDAAG':'MEER'}</span>
        </div>
        <div class="toggle-col">
          <label class="mini-switch ${scopeIsGemeente?'checked scope-gemeente':'checked scope-regio'}" style="background:${scopeIsGemeente?'#0b5bd3':'#7c3aed'}">
            <input type="checkbox" ${scopeIsGemeente?'checked':''} data-type="scope" data-id="${b.id}">
            <span class="mini-slider"></span>
          </label>
          <span class="mini-label">${scopeIsGemeente?'GEMEENTE':'REGIO'}</span>
        </div>
        <div class="toggle-col">
          <label class="mini-switch aan ${s.aan?'checked':''}">
            <input type="checkbox" ${s.aan?'checked':''} data-type="aan" data-id="${b.id}">
            <span class="mini-slider"></span>
          </label>
          <span class="mini-label">${s.aan?'AAN':'UIT'}</span>
        </div>
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const id = e.target.dataset.id;
      const type = e.target.dataset.type;
      if(!state[id]) state[id]={aan:true,vandaag:false,scope:'gemeente'};
      if(type==='vandaag'){ state[id].vandaag = e.target.checked; }
      if(type==='scope'){ state[id].scope = e.target.checked?'gemeente':'regio'; }
      if(type==='aan'){ state[id].aan = e.target.checked; }
      saveState(); render();
      if(window.filterNews) window.filterNews();
      if(window.applyFilters) window.applyFilters();
      if(typeof refreshNews==='function' && type==='aan'){ setTimeout(()=>{ try{refreshNews()}catch{} }, 50); }
    });
  });
}
function updateHeaderCount(){
  const aan = Object.values(state).filter(s=>s.aan).length;
  const countEl = document.getElementById('header-count');
  if(countEl) countEl.textContent = `${aan} v/d ${BRONNEN.length} bronnen ingeschakeld`;
  const btn = document.getElementById('btn-all');
  if(btn){
    btn.classList.remove('all-on','all-off','some-on');
    if(aan===BRONNEN.length){ btn.classList.add('all-on'); btn.textContent='Alles aan'; }
    else if(aan===0){ btn.classList.add('all-off'); btn.textContent='Alles uit'; }
    else { btn.classList.add('some-on'); btn.textContent='Alles aan/uit'; }
  }
}
function openPanel(){
  document.getElementById('filter-header').classList.add('open');
  document.getElementById('source-panel').classList.add('open');
  document.body.classList.add('panel-open');
}
function closePanel(){
  document.getElementById('filter-header').classList.remove('open');
  document.getElementById('source-panel').classList.remove('open');
  document.body.classList.remove('panel-open');
}
function resetFilters(){ BRONNEN.forEach(b=>state[b.id]={aan:true,vandaag:false,scope:'gemeente'}); saveState(); render(); if(window.filterNews) filterNews(); }

document.getElementById('filter-header').addEventListener('click', (e)=>{
  if(e.target.id==='btn-all' || e.target.closest('#btn-all') || e.target.closest('.bell-slot')){
    if(e.target.closest('.bell-slot')) return;
    e.stopPropagation();
    const allOn = Object.values(state).every(s=>s.aan);
    BRONNEN.forEach(b=>state[b.id].aan = !allOn);
    saveState(); render(); if(window.filterNews) filterNews();
    return;
  }
  const p = document.getElementById('source-panel');
  if(p.classList.contains('open')) closePanel(); else openPanel();
});

function moveOldBell(){
  const slot = document.getElementById('bell-slot');
  if(!slot) return;
  const header = document.querySelector('header');
  const candidates = header.querySelectorAll('button, [id*="push" i], [class*="push" i], [id*="bell" i], [class*="bell" i]');
  candidates.forEach(el=>{
    if(el.closest('#bell-slot') || el.id==='btn-all' || el.classList.contains('filter-header-arrow') || el.closest('.filter-header-left')) return;
    const txt = (el.textContent + ' ' + (el.innerHTML||'')).toLowerCase();
    if(txt.includes('🔔') || el.id.toLowerCase().includes('push') || el.className.toLowerCase().includes('bell') || el.className.toLowerCase().includes('push')){
      slot.appendChild(el);
    }
  });
}

loadState(); render(); saveState(); closePanel();
moveOldBell();
setTimeout(moveOldBell, 300);
setTimeout(moveOldBell, 1000);
setTimeout(moveOldBell, 2500);
const obs = new MutationObserver(()=> moveOldBell());

const BRONNEN = [
  {id:'De Stentor', name:'De Stentor', sub:'regionaal (Ommen)'},

];
let state = {};
function loadState(){
  try{
    const v2 = localStorage.getItem('nieuwsommen_bronnen_v2');
    if(v2){
      state = JSON.parse(v2);
      let changed=false;
      if(state['Salland Centraal']){
        delete state['Salland Centraal'];
        changed=true;
      }
      BRONNEN.forEach(b=>{
        if(!state[b.id]){
          state[b.id]={aan:true, vandaag:false, scope:'gemeente'};
          changed=true;
        }
      });
      if(changed){
        saveState();
      }
    } else {
      const old = {};
      BRONNEN.forEach(b=> old[b.id] = {aan:true, vandaag:false, scope:'gemeente'});
      state = old; saveState();
    }
  }catch(e){ 
    const fresh={};
    BRONNEN.forEach(b=>fresh[b.id]={aan:true,vandaag:false,scope:'gemeente'});
    state=fresh;
  }
}
function saveState(){
  localStorage.setItem('nieuwsommen_bronnen_v2', JSON.stringify(state));
  updateHiddenCompat(); updateHeaderCount();
}
function updateHiddenCompat(){
  const cont = document.getElementById('compat-sources');
  cont.innerHTML='';
  BRONNEN.forEach(b=>{
    const s = state[b.id] || {aan:true,vandaag:false,scope:'gemeente'};
    let cb = document.createElement('input');
    cb.type='checkbox'; cb.className='source-filter'; cb.value=b.id; cb.checked=s.aan;
    cb.dataset.source=b.id;
    cont.appendChild(cb);

  const gemeenteCount = BRONNEN.filter(b=> (state[b.id]?.scope||'gemeente')==='gemeente').length;

function render(){
  const list = document.getElementById('source-list');
  list.innerHTML='';
  BRONNEN.forEach(b=>{
    const s = state[b.id] || {aan:true,vandaag:false,scope:'gemeente'};
    const row = document.createElement('div');
    row.className='source-row'+(s.aan?'':' off');
    row.dataset.source=b.id;
    const scopeIsGemeente = s.scope==='gemeente';
    row.innerHTML = \`
      <div class="source-meta">

        <div class="source-sub">\${b.sub}</div>

          <span class="mini-label">\${s.vandaag?'VANDAAG':'MEER'}</span>
        </div>
        <div class="toggle-col">
          <label class="mini-switch \${scopeIsGemeente?'checked scope-gemeente':'checked scope-regio'}" style="background:\${scopeIsGemeente?'#0b5bd3':'#7c3aed'}">
            <input type="checkbox" \${scopeIsGemeente?'checked':''} data-type="scope" data-id="\${b.id}">
            <span class="mini-slider"></span>
          </label>
          <span class="mini-label">\${scopeIsGemeente?'GEMEENTE':'REGIO'}</span>
        </div>
        <div class="toggle-col">
          <label class="mini-switch aan \${s.aan?'checked':''}">
            <input type="checkbox" \${s.aan?'checked':''} data-type="aan" data-id="\${b.id}">
            <span class="mini-slider"></span>
          </label>
          <span class="mini-label">\${s.aan?'AAN':'UIT'}</span>
        </div>
      </div>
    \`;
    list.appendChild(row);
  });
  list.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const id = e.target.dataset.id;
      const type = e.target.dataset.type;
      if(!state[id]) state[id]={aan:true,vandaag:false,scope:'gemeente'};
      if(type==='vandaag'){ state[id].vandaag = e.target.checked; }
      if(type==='scope'){ state[id].scope = e.target.checked?'gemeente':'regio'; }
      if(type==='aan'){ state[id].aan = e.target.checked; }
      saveState(); render();
      if(window.filterNews) window.filterNews();
      if(window.applyFilters) window.applyFilters();
      if(typeof refreshNews==='function' && type==='aan'){ setTimeout(()=>{ try{refreshNews()}catch{} }, 50); }
    });
  });
}
function updateHeaderCount(){
  const aan = Object.values(state).filter(s=>s.aan).length;
  const countEl = document.getElementById('header-count');
  if(countEl) countEl.textContent = \`\${aan} v/d \${BRONNEN.length} bronnen ingeschakeld\`;
  const btn = document.getElementById('btn-all');
  if(btn){
    btn.classList.remove('all-on','all-off','some-on');
    if(aan===BRONNEN.length){ btn.classList.add('all-on'); btn.textContent='Alles aan'; }
    else if(aan===0){ btn.classList.add('all-off'); btn.textContent='Alles uit'; }
    else { btn.classList.add('some-on'); btn.textContent='Alles aan/uit'; }
  }
}

function closePanel(){

function resetFilters(){ BRONNEN.forEach(b=>state[b.id]={aan:true,vandaag:false,scope:'gemeente'}); saveState(); render(); if(window.filterNews) filterNews(); }

document.getElementById('filter-header').addEventListener('click', (e)=>{
  if(e.target.id==='btn-all' || e.target.closest('#btn-all') || e.target.closest('.bell-slot')){
    if(e.target.closest('.bell-slot')) return;
    e.stopPropagation();
    const allOn = Object.values(state).every(s=>s.aan);
    BRONNEN.forEach(b=>state[b.id].aan = !allOn);
    saveState(); render(); if(window.filterNews) filterNews();
    return;
  }
  const p = document.getElementById('source-panel');
  if(p.classList.contains('open')) closePanel(); else openPanel();
});

function moveOldBell(){
  const slot = document.getElementById('bell-slot');
  if(!slot) return;
  const header = document.querySelector('header');
  const candidates = header.querySelectorAll('button, [id*="push" i], [class*="push" i], [id*="bell" i], [class*="bell" i]');
  candidates.forEach(el=>{
    if(el.closest('#bell-slot') || el.id==='btn-all' || el.classList.contains('filter-header-arrow') || el.closest('.filter-header-left')) return;
    const txt = (el.textContent + ' ' + (el.innerHTML||'')).toLowerCase();
    if(txt.includes('\uD83D\uDD14') || el.id.toLowerCase().includes('push') || el.className.toLowerCase().includes('bell') || el.className.toLowerCase().includes('push')){
      slot.appendChild(el);
    }
  });
}

loadState(); render(); saveState(); closePanel();
moveOldBell();
setTimeout(moveOldBell, 300);
setTimeout(moveOldBell, 1000);
setTimeout(moveOldBell, 2500);
const obs = new MutationObserver(()=> moveOldBell());
obs.observe(document.querySelector('header'), {childList:true, subtree:true});

async function fetchViaProxy(targetUrl, attempt=0){

  }
}

function parseDutchDate(str){
  if(!str) return 0;
  let m = str.match(/(\\d{1,2})\\s+(januari|februari|maart|april|mei|juni|juli|augustus|september|oktober|november|december)\\s+(\\d{4})[^\\d]{0,10}(\\d{1,2}):(\\d{2})/i);
  if(m){
    const month = NL_MONTHS[m[2].toLowerCase()];
    if(month!==undefined) return new Date(parseInt(m[3]),month,parseInt(m[1]),parseInt(m[4]),parseInt(m[5])).getTime();
  }
  m = str.match(/(\\d{1,2})\\s+(januari|februari|maart|april|mei|juni|juli|augustus|september|oktober|november|december)\\s+(\\d{4})/i);

    const month = NL_MONTHS[m[2].toLowerCase()];

  }
  const ts = Date.parse(str);

}

function isOmmenNieuws(article) { const text = (article.title + " " + (article.description || "")).toLowerCase().replace(/<[^>]*>/g," "); return ommenKeywords.some(keyword => text.includes(keyword)); }
function addArticles(artikelen, bron) { artikelen.forEach(article => { allArticles.push({ ...article, source: bron }); }); }
function finalizeArticles() { const seen = new Set(); allArticles = allArticles.filter(article => { if (seen.has(article.link)) return false; seen.add(article.link); return true; }); allArticles.sort((a,b) => b.timestamp - a.timestamp); }

async function fetchRSS(url) {
    try {
        const feedConfig = feeds.find(f => f.url === url);
        const keywords = feedConfig?.filterKeywords?.map(k => k.toLowerCase()) || null;
        let articles = [];
        if (url.includes("sallandcentraal") || url.includes("vechtdalcentraal")) {
            try {
                const apiUrl = \`https://api.rss2json.com/v1/api.json?rss_url=\${encodeURIComponent(url)}\`;
                const res = await fetch(apiUrl);
                const data = await res.json();
                if (data.status === 'ok') {
                    articles = data.items.slice(0,25).map(item => ({
                        title: item.title,
                        link: item.link,
                        description: item.description,
                        timestamp: Date.parse(item.pubDate) || Date.now(),
                    }));
                }
            } catch(e) { articles = []; }
        } else {
            const text = await fetchViaProxy(url);
            if (!text) return [];
            const xml = new DOMParser().parseFromString(text,"text/xml");
            const items = Array.from(xml.getElementsByTagName("item"));
            articles = items.slice(0,25).map(item => {
                let link = ""; const linkElement = item.querySelector("link");
                if (linkElement) link = linkElement.getAttribute("href") || linkElement.textContent || "";
                const date = item.querySelector("pubDate")?.textContent?.trim() || "";
                return {
                    title: item.querySelector("title")?.textContent?.trim() || "Geen titel",
                    link: link.trim(),
                    timestamp: Date.parse(date) || 0,
                };
            });
        }
        if (keywords && keywords.length > 0) {
            articles = articles.filter(a => keywords.some(k => (a.title||"").toLowerCase().includes(k)));
        }
        return articles;
    } catch(error) { return []; }
}

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieuw(s)Ommen</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon-192x192.png" type="image/png">
    <style>
        /* INFO-ICOON - kost geen extra ruimte, rechts naast titel */
    header h1{
        display:flex;
        align-items:center;
        gap:12px;
        justify-content:center;
        width:100%;
    }
    .title-left{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:0;
    }
    .info-icon-btn{
        width:32px;
        height:32px;
        border-radius:50%;
        background:rgba(255,255,255,0.18);
        border:1.5px solid rgba(255,255,255,0.45);
        display:inline-flex;
        align-items:center;
        justify-content:center;
        color:#fff;
        text-decoration:none;
        font-weight:900;
        font-size:22px;
        line-height:1;
        flex-shrink:0;
        transition:background .15s;
    }
    .info-icon-btn:hover{background:rgba(255,255,255,0.30)}
    /* LIGGENDE s - meer ruimte links, minder rechts, niet lager */
    .rotated-s{
        display:inline-block;
        transform:rotate(90deg);
        font-weight:900;
        font-size:0.88em;
        margin:0 -1px 0 5px;
        position:relative;
        top:1px;
        line-height:1;
        vertical-align:middle;
    }
    /* op smal scherm blijft hij netjes rechts */
    @media(max-width:400px){
        header h1{font-size:1.4em}
    }
    </style>
</head>
<body>
<header>
    <h1>
        <span class="title-left">📰 Nieuw<span class="rotated-s">s</span>Ommen</span>
        <a href="informatie.html" class="info-icon-btn" title="Info over deze app" aria-label="Informatie">i</a>
    </h1>
    <div class="search-row">
        <input type="text" id="search-input" placeholder="Zoek in nieuws...">
    </div>
    <div class="filter-row">
        <div class="controls-row">
            <label class="switch-label">
                <span>Regio</span>
                <input type="checkbox" id="only-ommen" checked>
                <span class="slider"></span>
                <span>Gemeente</span>
            </label>
            <div class="source-wrapper">
                <button id="source-button">Bronnen ▼</button>
                <div id="source-menu" class="source-menu">
                    <label><input type="checkbox" class="source-filter" value="De Stentor" checked> De Stentor</label>
                    <label><input type="checkbox" class="source-filter" value="Gemeente Ommen" checked> Gemeente Ommen</label>
                    <label><input type="checkbox" class="source-filter" value="Ommen City" checked> Ommen City</label>
                    <label><input type="checkbox" class="source-filter" value="OudOmmen" checked> OudOmmen</label>
                    <label><input type="checkbox" class="source-filter" value="RTV Oost" checked> RTV Oost</label>
                    <label><input type="checkbox" class="source-filter" value="RTV Vechtdal" checked> RTV Vechtdal</label>
                    <label><input type="checkbox" class="source-filter" value="Vechtdal Centraal" checked> Vechtdal Centraal</label>
                </div>
            </div>
        </div>
    </div>
</header>
<main>
    <div id="news-container">Bezig met laden...</div>
</main>
<footer>
    <button onclick="refreshNews()">🔄 Vernieuwen</button>
</footer>
<script src="script.js"></script>
<script src="push.js"></script>
<script src="article-focus.js"></script>
</body>
</html>

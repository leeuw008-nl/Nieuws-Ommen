<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieuw(s)Ommen</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon-192x192.png" type="image/png">
    <style>
    /* INFO-ICOON - verticaal gecentreerd */
    header h1{
        display:flex;align-items:center;gap:12px;justify-content:center;width:100%;line-height:1;
    }
    .title-left{display:inline-flex;align-items:center;justify-content:center;gap:0;line-height:1;}
    .info-icon-btn{
        width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.18);
        border:1.5px solid rgba(255,255,255,0.45);display:inline-flex;align-items:center;justify-content:center;
        color:#fff;text-decoration:none;font-weight:900;font-size:26px;line-height:1;flex-shrink:0;transition:background .15s;
        align-self:center;vertical-align:middle;margin:0;position:relative;top:0;
    }
    .info-icon-btn:hover{background:rgba(255,255,255,0.30)}
    @media(max-width:400px){header h1{font-size:1.4em}}

    /* FILTER HEADER */
    .filter-header{
        margin:12px 12px 0 12px;
        background:#fff;
        border:1px solid #e5e7eb;
        border-radius:12px;
        padding:12px 14px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        cursor:pointer;
        user-select:none;
        box-shadow:0 1px 3px rgba(0,0,0,.06);
        transition:all .15s;
    }
    .filter-header:active{transform:scale(0.99)}
    .filter-header.open{border-radius:12px 12px 0 0;border-bottom:2px solid #0b5bd3 !important}
    .filter-header-left{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.2px}
    .filter-header-count{font-weight:500;color:#0b5bd3;font-size:12px}
    .filter-header-arrow{font-size:14px;transition:transform .2s;color:#6b7280}
    .filter-header.open .filter-header-arrow{transform:rotate(180deg)}

    /* PANEL */
    #source-panel{
        margin:0 12px;
        background:#fff;
        border:1px solid #e5e7eb;
        border-top:0;
        border-radius:0 0 12px 12px;
        overflow:hidden;
        max-height:0;
        opacity:0;
        transition:max-height .35s ease, opacity .25s ease;
        box-shadow:0 4px 12px rgba(0,0,0,.06);
    }
    #source-panel.open{max-height:3000px;opacity:1;}

    /* 3 REGELS - helemaal links + halve ruimte + blauwe lijntjes 2px */
    .panel-hint{
        background:#f8fafc;
        border-top:2px solid #0b5bd3;
        border-bottom:2px solid #0b5bd3;
        padding:4px 8px !important;
        font-size:11px;color:#475569;line-height:1.3;
        text-align:left;
    }
    .panel-hint ul{
        margin:0 !important;
        padding:0 0 0 14px !important;
        list-style:disc;
        list-style-position:outside;
        text-align:left;
    }
    .panel-hint li{
        margin:1px 0 !important;
        padding:0 !important;
        text-align:left;
    }

    /* SOURCE ROW - grotere tekst zonder grotere regelafstand + blauwe lijntjes 1px */
    .source-list{display:flex;flex-direction:column}
    .source-row{
        display:grid;
        grid-template-columns:40px 1fr 210px;
        align-items:center;
        gap:10px;
        padding:5px 12px;
        border-bottom:1px solid #0b5bd3;
        transition:background .12s, opacity .15s;
    }
    .source-row:last-child{border-bottom:1px solid #0b5bd3}
    .source-row:hover{background:#f8fafc}
    .source-row.off{opacity:.48}
    .source-row.off .toggles{pointer-events:none;opacity:.5}

    .source-icon{
        width:36px;height:36px;border-radius:10px;
        display:flex;align-items:center;justify-content:center;
        font-weight:800;font-size:14px;color:#fff;flex-shrink:0;
    }
    .source-meta{display:flex;flex-direction:column;min-width:0;justify-content:center}
    .source-name{font-weight:700;font-size:14.5px;line-height:1.0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.1px}
    .source-sub{font-size:11px;color:#64748b;margin-top:0;line-height:1.0}

    /* 3 TOGGLES - omgedraaid: VANDAAG/GEMEENTE/AAN = links */
    .toggles{display:grid;grid-template-columns:70px 70px 60px;gap:6px;align-items:start}
    .toggle-col{display:flex;flex-direction:column;align-items:center;gap:4px}
    .mini-switch{position:relative;width:36px;height:22px;background:#e5e7eb;border-radius:999px;cursor:pointer;transition:background .2s;border:0;padding:0;display:inline-flex}
    .mini-switch input{display:none}
    .mini-slider{position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s;transform:translateX(14px)}
    .mini-switch input:checked + .mini-slider{transform:translateX(0px) !important}
    .mini-switch.vandaag.checked{background:#0b5bd3}
    .mini-switch.scope.checked{background:#0b5bd3}
    .mini-switch.scope:not(.checked){background:#7c3aed !important}
    .mini-switch.aan.checked{background:#16a34a}
    .mini-switch.checked{background:#0b5bd3}
    .toggle-col .mini-switch{transition:.2s}
    .mini-label{font-size:9.5px;font-weight:700;letter-spacing:.4px;color:#6b7280;text-transform:uppercase;text-align:center;line-height:1}
    .mini-label.active{color:#0f172a}

    .panel-footer{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-top:2px solid #0b5bd3}
    .panel-footer button{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;cursor:pointer}
    .panel-footer button.primary{background:#0f172a;color:#fff;border-color:#0f172a;font-weight:600}

    .search-row{padding:0 12px 8px 12px}
    #search-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.6)}

    /* FIX: bel groter en breder venster, niet hoger */
    #push-toggle{
        font-size:22px !important;
        padding:4px 18px !important;
        min-width:56px !important;
        width:auto !important;
        height:30px !important;
        line-height:1 !important;
        display:inline-flex !important;
        align-items:center !important;
        justify-content:center !important;
        border-radius:20px !important;
    }
    #bell-slot{min-width:60px !important}
    </style>
</head>
<body>
<header>
    <h1>
        <span class="title-left">📰 Nieuw(s)Ommen</span>
        <a href="informatie.html" class="info-icon-btn" title="Info over deze app" aria-label="Informatie">i</a>
    </h1>
    <div class="search-row">
        <input type="text" id="search-input" placeholder="Zoek in nieuws...">
    </div>
    <div class="filter-header" id="filter-header">
        <div class="filter-header-left">🔧 BRONNEN & FILTERS <span class="filter-header-count" id="header-count">9 v/d 9 bronnen ingeschakeld</span></div>
        <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:11px;color:#0b5bd3;font-weight:600" id="btn-all">Alles aan/uit</span>
            <span class="filter-header-arrow">▼</span>
        </div>
    </div>
    <div id="source-panel">
        <div class="panel-hint"><ul>
                <li>● VANDAAG ←|→ MEER = alleen vandaag of meerdere dagen</li>
                <li>● GEMEENTE ←|→ REGIO = alleen gemeente Ommen of ook regio</li>
                <li>● AAN ←|→ UIT = aan/uit-schakelen bronnen (tonen + notificaties)</li>
            </ul></div>
        <div class="source-list" id="source-list"></div>
        <div class="panel-footer">
            <button onclick="resetFilters()">Reset</button>
            <button class="primary" onclick="closePanel()">Sluiten ▲</button>
        </div>
    </div>
    <div id="compat-hidden" style="display:none">
        <input type="checkbox" id="only-ommen" checked>
        <div id="compat-sources"></div>
    </div>
</header>
<main>
    <div id="news-container">Bezig met laden...</div>
</main>
<footer>
    <button onclick="refreshNews()">🔄 Vernieuwen</button>
</footer>
<script>
const BRONNEN = [
  {id:'De Stentor', name:'De Stentor', sub:'regionaal (Ommen)', color:'#ef4444', letter:'S'},
  {id:'Gemeente Ommen', name:'Gemeente Ommen', sub:'officieel', color:'#0b5bd3', letter:'G'},
  {id:'Ommen City', name:'Ommen City', sub:'lokaal', color:'#0ea5e9', letter:'O'},
  {id:'OudOmmen', name:'OudOmmen', sub:'historie', color:'#92400e', letter:'O'},
  {id:'RondOmmen', name:'RondOmmen', sub:'lokaal', color:'#16a34a', letter:'R'},
  {id:'RTV Oost', name:'RTV Oost', sub:'Overijssel', color:'#7c3aed', letter:'O'},
  {id:'RTV Vechtdal', name:'RTV Vechtdal', sub:'Vechtdal', color:'#db2777', letter:'V'},
  {id:'Salland Centraal', name:'Salland Centraal', sub:'Salland', color:'#ea580c', letter:'S'},
  {id:'Vechtdal Centraal', name:'Vechtdal Centraal', sub:'112 & dorpsnieuws', color:'#0f172a', letter:'V'},
];
let state = {};

function loadState(){
  try{
    const v2 = localStorage.getItem('nieuwsommen_bronnen_v2');
    if(v2){
      state = JSON.parse(v2);
      // MIGRATIE 7 -> 9
      let changed=false;
      BRONNEN.forEach(b=>{ if(!state[b.id]){ state[b.id]={aan:true, vandaag:false, scope:'gemeente'}; changed=true; } });
      if(changed) saveState();
    } else {
      const old = {};
      BRONNEN.forEach(b=> old[b.id] = {aan:true, vandaag:false, scope:'gemeente'});
      state = old;
      saveState();
    }
  }catch(e){
    BRONNEN.forEach(b=>state[b.id]={aan:true,vandaag:false,scope:'gemeente'});
  }
}
function saveState(){
  localStorage.setItem('nieuwsommen_bronnen_v2', JSON.stringify(state));
  updateHiddenCompat();
  updateHeaderCount();
}

function updateHiddenCompat(){
  const cont = document.getElementById('compat-sources');
  cont.innerHTML='';
  BRONNEN.forEach(b=>{
    const s = state[b.id] || {aan:true,vandaag:false,scope:'gemeente'};
    let cb = document.createElement('input');
    cb.type='checkbox'; cb.className='source-filter'; cb.value=b.id; cb.checked=s.aan;
    cb.dataset.source=b.id;
    cont.appendChild(cb);
    cb.dispatchEvent(new Event('change',{bubbles:true}));
  });
  const gemeenteCount = BRONNEN.filter(b=> (state[b.id]?.scope||'gemeente')==='gemeente').length;
  const onlyCb = document.getElementById('only-ommen');
  if(onlyCb){
    onlyCb.checked = gemeenteCount >= 5;
    onlyCb.dispatchEvent(new Event('change',{bubbles:true}));
  }
}

function render(){
  const list = document.getElementById('source-list');
  list.innerHTML='';
  BRONNEN.forEach(b=>{
    const s = state[b.id] || {aan:true,vandaag:false,scope:'gemeente'};
    const row = document.createElement('div');
    row.className='source-row'+(s.aan?'':' off');
    row.dataset.source=b.id;
    row.innerHTML = `
      <div class="source-icon" style="background:${b.color}">${b.letter}</div>
      <div class="source-meta">
        <div class="source-name">${b.name}</div>
        <div class="source-sub">${b.sub}</div>
      </div>
      <div class="toggles">
        <div class="toggle-col">
          <label class="mini-switch vandaag ${s.vandaag?'checked':''}">
            <input type="checkbox" ${s.vandaag?'checked':''} data-type="vandaag" data-id="${b.id}">
            <span class="mini-slider"></span>
          </label>
          <span class="mini-label ${s.vandaag?'active':''}">${s.vandaag?'VANDAAG':'MEER'}</span>
        </div>
        <div class="toggle-col">
          <label class="mini-switch scope ${s.scope==='gemeente'?'checked':''}" style="background:${s.scope==='gemeente'?'#0b5bd3':'#7c3aed'}">
            <input type="checkbox" ${s.scope==='gemeente'?'checked':''} data-type="scope" data-id="${b.id}">
            <span class="mini-slider"></span>
          </label>
          <span class="mini-label active">${s.scope==='gemeente'?'GEMEENTE':'REGIO'}</span>
        </div>
        <div class="toggle-col">
          <label class="mini-switch aan ${s.aan?'checked':''}" style="background:${s.aan?'#16a34a':'#e5e7eb'}">
            <input type="checkbox" ${s.aan?'checked':''} data-type="aan" data-id="${b.id}">
            <span class="mini-slider"></span>
          </label>
          <span class="mini-label ${s.aan?'active':''}">${s.aan?'AAN':'UIT'}</span>
        </div>
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const id = e.target.dataset.id;
      const type = e.target.dataset.type;
      if(!state[id]) state[id]={aan:true,vandaag:false,scope:'gemeente'};
      if(type==='vandaag'){ state[id].vandaag = e.target.checked; }
      if(type==='scope'){ state[id].scope = e.target.checked?'gemeente':'regio'; }
      if(type==='aan'){ state[id].aan = e.target.checked; }
      saveState();
      render();
      if(window.filterNews) window.filterNews();
      if(window.applyFilters) window.applyFilters();
    });
  });
}

function updateHeaderCount(){
  const aan = Object.values(state).filter(s=>s.aan).length;
  document.getElementById('header-count').textContent = `${aan} v/d ${BRONNEN.length} bronnen ingeschakeld`;
}

function openPanel(){
  document.getElementById('filter-header').classList.add('open');
  document.getElementById('source-panel').classList.add('open');
}
function closePanel(){
  document.getElementById('filter-header').classList.remove('open');
  document.getElementById('source-panel').classList.remove('open');
}
function resetFilters(){
  BRONNEN.forEach(b=>state[b.id]={aan:true,vandaag:false,scope:'gemeente'});
  saveState(); render();
  if(window.filterNews) filterNews();
}

document.getElementById('filter-header').addEventListener('click', (e)=>{
  if(e.target.id==='btn-all' || e.target.closest('#btn-all')){
    e.stopPropagation();
    const allOn = Object.values(state).every(s=>s.aan);
    BRONNEN.forEach(b=>state[b.id].aan = !allOn);
    saveState(); render();
    if(window.filterNews) filterNews();
    return;
  }
  const p = document.getElementById('source-panel');
  if(p.classList.contains('open')) closePanel(); else openPanel();
});

loadState(); render(); saveState();
closePanel();
</script>
